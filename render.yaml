services:
  - type: web
    name: smart-interview-backend
    env: node
    rootDir: backend
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CLIENT_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: openai/gpt-oss-120b
      - key: OPENAI_TIMEOUT_MS
        value: 30000
      - key: GROQ_TRANSCRIPTION_MODEL
        value: whisper-large-v3-turbo
      - key: JUDGE0_URL
        value: https://ce.judge0.com
      - key: EXECUTION_TIMEOUT_MS
        value: 12000
      - key: MAIL_FROM
        value: "SmartInterview AI" <no-reply@smartinterview.ai>
